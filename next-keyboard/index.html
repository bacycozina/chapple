<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>차세대 키보드</title><link rel="stylesheet" href="style.css"></head><body><main><header><button class="wordmark" id="home" aria-label="시작 화면">CK<span>차세대 키보드</span></button><button id="settings" class="mini">설정</button></header><section id="screen"></section></main><dialog id="options"><form method="dialog"><div class="dialog-head"><span></span><button aria-label="설정 닫기" class="mini">닫기 ×</button></div><h2>설정</h2><label class="setting">효과음 <input id="sound" type="checkbox" role="switch"></label><label class="setting" for="volume">효과음 크기 <output id="volumeLabel"></output></label><input id="volume" type="range" min="0" max="100"></form></dialog><dialog id="deleteDialog"><h2>저장 파일을 지울까요?</h2><p>이 슬롯의 진행 기록이 삭제됩니다.</p><div class="actions"><button id="cancelDelete">취소</button><button id="confirmDelete" class="pink">삭제</button></div></dialog><div id="notice" role="status"></div><script src="progression.js"></script><script src="app.js"></script><script src="replays.js"></script><script src="specials.js"></script><script src="game.js"></script></body></html>
